services:
  - type: web
    name: skill2job-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: gunicorn --config gunicorn.conf.py run:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard (Aiven MySQL URL)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_TOKEN_EXPIRY_MINUTES
        value: "60"
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL after deploying frontend
      - key: PYTHON_VERSION
        value: "3.11.0"
